<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ice Cream Dash</title>
<style>
  :root { --bg: #191928; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
               touch-action: none; overscroll-behavior: none;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; outline: none;
           width: min(100vw, calc(100vh * 576 / 640));
           height: min(100vh, calc(100vw * 640 / 576)); }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(() => {
  // ---------- Config ----------
  const COLS = 18, ROWS = 18, CELL = 32, HUD = 64;
  const W = COLS * CELL, H = ROWS * CELL + HUD;
  const SWIPE_PX = 24;
  const POINTS_PER_CREAM = 10;
  const BOMB_EVERY = 3;
  const MAX_BOMBS = 30;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 3));
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  canvas.focus();

  // ---------- State ----------
  const g = {
    state: 'ready',            // ready | playing | over
    player: { x: COLS >> 1, y: ROWS >> 1 },
    dx: 1, dy: 0,
    cream: { x: 0, y: 0 },
    bombs: [],
    score: 0, best: 0, eaten: 0,
    lastStep: 0, stepMs: 150, overAt: 0,
    lastBombMove: 0, bombMoveMs: 1000,   // bombs move once per second
    dragging: false, ox: 0, oy: 0,
  };
  try { g.best = parseInt(localStorage.getItem('icecream-best') || '0', 10) || 0; } catch (e) {}

  // ---------- Logic ----------
  const isBomb = (x, y) => g.bombs.some(b => b.x === x && b.y === y);

  function freeCell(minDist) {
    for (let t = 0; t < 1000; t++) {
      const p = { x: (Math.random() * COLS) | 0, y: (Math.random() * ROWS) | 0 };
      if (isBomb(p.x, p.y)) continue;
      if (p.x === g.cream.x && p.y === g.cream.y) continue;
      if (Math.abs(p.x - g.player.x) + Math.abs(p.y - g.player.y) < minDist) continue;
      return p;
    }
    return { x: 0, y: 0 };
  }

  function resetGame() {
    g.player = { x: COLS >> 1, y: ROWS >> 1 };
    g.dx = 1; g.dy = 0;
    g.score = 0; g.eaten = 0; g.stepMs = 150;
    g.bombs = [];
    g.cream = { x: -1, y: -1 };
    g.cream = freeCell(3);
    for (let i = 0; i < 3; i++) g.bombs.push(freeCell(4));
  }

  function startGame() {
    resetGame();
    g.state = 'playing';
    g.lastStep = performance.now();
    g.lastBombMove = g.lastStep;
  }

  function setDir(dx, dy) {
    if (g.state === 'ready') startGame();
    if (g.state !== 'playing') return;
    g.dx = dx; g.dy = dy;
  }

  function tapAction() {
    if (g.state === 'ready') startGame();
    else if (g.state === 'over' && performance.now() - g.overAt > 400) startGame();
  }

  function endGame() {
    g.state = 'over';
    g.overAt = performance.now();
    if (g.score > g.best) {
      g.best = g.score;
      try { localStorage.setItem('icecream-best', String(g.best)); } catch (e) {}
    }
  }

  // Every bomb drifts one cell in a random direction (edges wrap).
  // Bombs never land on the ice cream or on each other, but they CAN land on you.
  function moveBombs() {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const b of g.bombs) {
      const options = dirs
        .map(([dx, dy]) => ({ x: (b.x + dx + COLS) % COLS, y: (b.y + dy + ROWS) % ROWS }))
        .filter(p => !(p.x === g.cream.x && p.y === g.cream.y) && !isBomb(p.x, p.y));
      if (options.length) {
        const p = options[(Math.random() * options.length) | 0];
        b.x = p.x; b.y = p.y;
      }
    }
    if (isBomb(g.player.x, g.player.y)) endGame();
  }

  function step() {
    g.player.x = (g.player.x + g.dx + COLS) % COLS;   // walls wrap
    g.player.y = (g.player.y + g.dy + ROWS) % ROWS;

    if (isBomb(g.player.x, g.player.y)) {
      endGame();
      return;
    }
    if (g.player.x === g.cream.x && g.player.y === g.cream.y) {
      g.score += POINTS_PER_CREAM;
      g.eaten++;
      g.stepMs = Math.max(70, 150 - g.eaten * 3);
      g.cream = { x: -1, y: -1 };
      g.cream = freeCell(3);
      if (g.eaten % BOMB_EVERY === 0 && g.bombs.length < MAX_BOMBS) g.bombs.push(freeCell(4));
    }
  }

  // ---------- Drawing ----------
  function circle(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }
  function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }

  function drawIceCream(px, py) {
    // cone
    ctx.fillStyle = '#dea555';
    ctx.beginPath(); ctx.moveTo(px + 9, py + 16); ctx.lineTo(px + 23, py + 16); ctx.lineTo(px + 16, py + 29); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#b47832'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px + 12, py + 18); ctx.lineTo(px + 18, py + 26);
    ctx.moveTo(px + 20, py + 18); ctx.lineTo(px + 14, py + 26); ctx.stroke();
    // scoops + cherry
    circle(px + 16, py + 14, 8, '#ff96be');
    circle(px + 16, py + 8, 6, '#fff0c8');
    circle(px + 16, py + 3, 3, '#dc2846');
  }

  function drawBomb(px, py, t) {
    circle(px + 16, py + 19, 11, '#1e1e23');
    circle(px + 12, py + 15, 3, '#5a5a64');
    rect(px + 14, py + 5, 5, 5, '#785a32');
    ctx.strokeStyle = '#969696'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px + 19, py + 6); ctx.lineTo(px + 23, py + 3); ctx.stroke();
    const blink = Math.floor(t / 150) % 2;
    circle(px + 24, py + 3, blink ? 3.5 : 2.5, blink ? '#ffc800' : '#ff5000');
  }

  function drawPlayer(px, py) {
    rect(px + 8, py + 8, 4, 17, '#5a3719'); rect(px + 20, py + 8, 4, 17, '#5a3719');    // long hair (back)
    rect(px + 11, py + 26, 3, 5, '#ffcda0'); rect(px + 18, py + 26, 3, 5, '#ffcda0');   // legs
    rect(px + 10, py + 30, 4, 2, '#d23c78'); rect(px + 17, py + 30, 4, 2, '#d23c78');   // shoes
    rect(px + 6, py + 16, 3, 7, '#ffcda0'); rect(px + 23, py + 16, 3, 7, '#ffcda0');    // arms
    ctx.fillStyle = '#ff6eb4';                                                          // dress
    ctx.beginPath(); ctx.moveTo(px + 12, py + 15); ctx.lineTo(px + 20, py + 15);
    ctx.lineTo(px + 25, py + 27); ctx.lineTo(px + 7, py + 27); ctx.closePath(); ctx.fill();
    circle(px + 16, py + 9, 7, '#ffcda0');                                              // head
    ctx.fillStyle = '#5a3719';                                                          // hair (top + fringe)
    ctx.beginPath(); ctx.arc(px + 16, py + 8, 8, Math.PI, 0); ctx.fill();
    rect(px + 8, py + 7, 3, 7, '#5a3719'); rect(px + 21, py + 7, 3, 7, '#5a3719');
    circle(px + 22, py + 3, 3, '#ff3c3c'); circle(px + 25, py + 3, 3, '#ff3c3c');       // bow
    circle(px + 23.5, py + 3, 1.5, '#ffd54a');
    rect(px + 13, py + 9, 2, 2, '#141414'); rect(px + 18, py + 9, 2, 2, '#141414');     // eyes
    rect(px + 14, py + 12, 4, 1, '#d23c50');                                            // smile
  }

  function text(str, x, y, size, color, align = 'center') {
    ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.font = `800 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.fillText(str, x, y);
  }

  function render(t) {
    ctx.fillStyle = '#191928'; ctx.fillRect(0, 0, W, H);

    // HUD
    rect(0, 0, W, HUD, '#282841');
    text('SCORE ' + g.score, 16, HUD / 2, 28, '#ffffff', 'left');
    text('BEST ' + g.best, W - 16, HUD / 2, 22, '#c8c8e6', 'right');

    // board
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        rect(x * CELL, HUD + y * CELL, CELL, CELL, (x + y) % 2 ? '#7ec878' : '#6eb969');

    for (const b of g.bombs) drawBomb(b.x * CELL, HUD + b.y * CELL, t);
    drawIceCream(g.cream.x * CELL, HUD + g.cream.y * CELL);
    drawPlayer(g.player.x * CELL, HUD + g.player.y * CELL);

    if (g.state !== 'playing') {
      rect(0, HUD, W, H - HUD, 'rgba(0,0,0,0.63)');
      const cy = HUD + (H - HUD) / 2;
      if (g.state === 'ready') {
        text('ICE CREAM DASH', W / 2, cy - 70, 48, '#ffaac8');
        text('Collect the ice creams', W / 2, cy - 10, 22, '#ffffff');
        text('Avoid the bombs!', W / 2, cy + 20, 22, '#ffffff');
        text('Swipe or use arrow keys / WASD', W / 2, cy + 60, 18, '#c8c8e6');
        const pulse = 0.6 + 0.4 * Math.sin(t / 250);
        text('TAP TO PLAY', W / 2, cy + 110, 30, `rgba(255,255,255,${pulse})`);
      } else {
        text('GAME OVER', W / 2, cy - 80, 56, '#ff5a5a');
        text('SCORE ' + g.score, W / 2, cy - 10, 36, '#ffffff');
        if (g.score > 0 && g.score >= g.best) text('NEW BEST!', W / 2, cy + 30, 24, '#ffd54a');
        const pulse = 0.6 + 0.4 * Math.sin(t / 250);
        text('TAP TO PLAY AGAIN', W / 2, cy + 80, 28, `rgba(255,255,255,${pulse})`);
        text('Game over, better luck next time Nivea :)', W / 2, cy + 135, 20, '#ffaac8');
      }
    }
  }

  // ---------- Input ----------
  const toLogical = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  };

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    const p = toLogical(e);
    g.dragging = true; g.ox = p.x; g.oy = p.y;
    tapAction();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!g.dragging) return;
    e.preventDefault();
    const p = toLogical(e);
    const dx = p.x - g.ox, dy = p.y - g.oy;
    if (Math.hypot(dx, dy) < SWIPE_PX) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    g.ox = p.x; g.oy = p.y;   // re-anchor so swipes can be chained
  });
  const endDrag = () => { g.dragging = false; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    const map = {
      arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0],
    };
    if (map[k]) { e.preventDefault(); setDir(map[k][0], map[k][1]); }
    else if (k === ' ' || k === 'enter') { e.preventDefault(); tapAction(); }
  });

  // ---------- Main loop ----------
  resetGame();
  function frame(t) {
    if (g.state === 'playing' && t - g.lastStep >= g.stepMs) {
      g.lastStep = t;
      step();
    }
    if (g.state === 'playing' && t - g.lastBombMove >= g.bombMoveMs) {
      g.lastBombMove = t;
      moveBombs();
    }
    render(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
